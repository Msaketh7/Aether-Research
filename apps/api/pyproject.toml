[project]
name = "aether-api"
version = "0.1.0"
description = "Aether Research API and worker (one codebase, two process types - see ADR 0001)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.4",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "sqlalchemy[asyncio]>=2.0.52",
  "asyncpg>=0.31.0",
  "alembic>=1.19.2",
  "redis>=8.1.0",
  "pgvector>=0.4.1",
  "aioboto3>=15.5.0",
  "anthropic>=1.0.0",
  "openai>=2.0.0",
  "pyyaml>=6.0.3",
  "types-pyyaml>=6.0.12",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "httpx>=0.28.1",
  "ruff>=0.16.6",
  "mypy>=2.3.1",
  "moto[s3,server]>=5.1.0",
  "types-aioboto3[s3]>=15.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Lint and format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # import sorting
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
  "ASYNC",# async correctness
  "S",    # bandit security rules
  "RUF",
  "ANN",  # every function is annotated (project rule: type hints everywhere)
]
ignore = [
  "ANN401", # typing.Any is occasionally the honest annotation
  "B008",   # FastAPI's Depends() in defaults is the framework's idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests assert; asserts are the point.
"tests/**" = ["S101", "ANN201", "ANN001"]
# Migration bodies are generated by Alembic and then curated. Reformatting the
# generated DDL would make a future autogenerate diff unreadable, which is the
# one thing that has to stay easy to review.
"migrations/versions/**" = ["E501", "D", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
addopts = "-q --strict-markers"
