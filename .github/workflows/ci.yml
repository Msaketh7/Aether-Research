name: CI

# The fast gates: formatting, lint, types, secrets, static analysis, and the
# infrastructure descriptions Phase 23 added. Everything here answers in a few
# minutes and fails for a reason that is in the diff.
#
# The slow half - unit tests, integration tests against real Postgres and
# Redis, Playwright, the production build - lives in test.yml and is called
# from here, so a pull request has one required check rather than five and one
# place to look when it goes red. The evaluation benchmark (eval.yml) is
# separate because it costs real money, and the images (build.yml) because they
# are an artifact rather than a verdict.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job that needs more asks for it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # --- formatting, lint and types -------------------------------------------

  frontend-static:
    name: Frontend (format, lint, types)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # The lockfile is authoritative. The initial cold resolve needs
      # --legacy-peer-deps (an npm arborist bug in the vitest peer graph);
      # `npm ci` from the committed lockfile does not.
      - run: npm ci

      # Prettier covers Markdown and YAML across the whole repository, backend
      # documentation and these workflows included.
      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

  backend-static:
    name: Backend (format, lint, types)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Format check
        run: uv run ruff format --check .

      # Ruff's select list includes `S`, the bandit security rules, so Python
      # static analysis is this step rather than a separate SAST tool. A second
      # scanner over the same code would produce a second backlog of the same
      # findings.
      - name: Lint and Python static analysis
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy app

  # --- security -------------------------------------------------------------

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Gitleaks scans history, not just the working tree, so a key
          # committed and then removed is still a finding - which is the point,
          # because it is still published.
          fetch-depth: 0

      # The released binary rather than a marketplace action: one fewer
      # third-party action with a token in its environment, and the version is
      # pinned here rather than by a tag someone else can move.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      # `gitleaks git`, not `gitleaks detect`: the subcommands were renamed and
      # `detect` no longer exists in 8.30. Configuration, including the one
      # allowance for .env.example, is in .gitleaks.toml at the root.
      - name: Scan
        run: gitleaks git --no-banner --redact --exit-code 1 .

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: npm ci

      # Capped at high: the transitive dev graph of a Next.js toolchain
      # produces a steady trickle of low and moderate advisories that never
      # reach a production bundle, and a gate that fires every week is one
      # people learn to ignore.
      #
      # `continue-on-error` throughout, and deliberately: an advisory published
      # overnight is not a reason a change that touches neither ecosystem
      # should fail to merge. The finding is in the job summary.
      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      # The resolved environment, not the declared ranges, so what is scanned
      # is what would actually be installed.
      - name: pip-audit
        run: uv run --with pip-audit pip-audit
        working-directory: apps/api
        continue-on-error: true

  # --- the infrastructure descriptions --------------------------------------

  # Phase 23 added three descriptions of how to run this system, none of which
  # can be executed on the machine it is developed on. This job is where they
  # are checked by their own tools; the claims those tools cannot make - that
  # the files still describe *this* application - are asserted by
  # apps/api/tests/test_infrastructure.py, in the backend suite.
  infrastructure:
    name: Infrastructure (terraform, dockerfiles, workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.4
          terraform_wrapper: false

      - name: Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      # -backend=false: validation needs the provider schemas and nothing else,
      # so this runs with no credentials, no state bucket and no cloud.
      - name: Terraform validate
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

      # The repository is mounted rather than the Dockerfiles piped in on
      # stdin, because hadolint reads `.hadolint.yaml` from its working
      # directory - and piping would silently lint under the default rules,
      # with the two declined checks and their reasons ignored.
      - name: Lint the Dockerfiles
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo hadolint/hadolint:v2.14.0-alpine \
            hadolint infra/docker/api.Dockerfile infra/docker/web.Dockerfile

      # These workflow files are themselves configuration that only fails when
      # it runs. actionlint catches the half of that which is static: an
      # expression that cannot evaluate, a `needs` on a job that is not there,
      # a shell that will not parse.
      - name: Lint the workflows
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint -color

  # --- the slow half --------------------------------------------------------

  tests:
    name: Tests
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  # One check to require on a branch protection rule, which is green only when
  # everything above it is. Without this, adding a job to this file silently
  # leaves it optional until somebody remembers to add it to the rule as well.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [frontend-static, backend-static, secrets, dependencies, infrastructure, tests]
    if: always()
    steps:
      - name: Verdict
        run: |
          echo "${{ join(needs.*.result, ' ') }}"
          [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "false" ]]
