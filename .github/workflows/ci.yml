name: CI

# Runs on every pull request and on main. Scope grows with the build: today it
# covers the frontend, the backend, the cross-language contract between them,
# and dependency scanning on both sides. The evaluation gate and container
# image scanning are added by the phases that introduce them - images do not
# exist until Phase 23, and scanning one that has not been built is a job that
# always passes (docs/TDD.md section 20).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  frontend:
    name: Frontend (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # The lockfile is authoritative. The initial cold resolve needs
      # --legacy-peer-deps (an npm arborist bug in the vitest peer graph);
      # `npm ci` from the committed lockfile does not.
      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Unit tests
        run: npm run test --workspaces --if-present

      - name: Build
        run: npm run build --workspace @aether/web

  backend:
    name: Backend (lint, typecheck, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api

    services:
      # The pgvector image, not plain postgres: the suite must exercise the
      # 0002 migration and the embedding column, which a stock server cannot
      # create. Locally the tests fall back to a throwaway cluster and skip the
      # vector-specific assertions with an explicit reason.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether
          POSTGRES_DB: aether_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aether"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # The worker's queue (Phase 13). Its blocking pop, its timeout and the
      # fact that one job reaches exactly one worker cannot be faked, so the
      # tests that assert them skip locally and run here.
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      AETHER_TEST_DATABASE_URL: postgresql+asyncpg://aether:aether@127.0.0.1:5432/aether_test
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy app

      # Reversibility is a deployment property, so it is verified separately
      # against a clean database rather than inside the suite, which shares one.
      - name: Migrations round trip
        run: uv run python scripts/check_migrations.py

      # Includes the cross-language contract tests, which read
      # packages/shared-types and fail if the Python and TypeScript
      # vocabularies have diverged, and the schema tests, which run against the
      # database Alembic actually built.
      # Parallel, with a database per worker on the service container (see
      # tests/support/postgres.py). Two workers, not four: the hosted runner has
      # two cores, and oversubscribing only adds contention.
      - name: Tests
        run: uv run pytest -n 2

  # Known-vulnerable dependencies, both ecosystems. Separate from the build
  # jobs on purpose: an advisory published overnight is not a reason the
  # frontend tests should go red, and the two questions are answered by
  # different people. `continue-on-error` is deliberate for the same reason -
  # the finding is reported in the job summary and does not block a merge that
  # has nothing to do with it. Phase 23 adds image scanning, once there are
  # images.
  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: npm ci

      # Capped at high: the transitive dev graph of a Next.js toolchain
      # produces a steady trickle of low and moderate advisories that never
      # reach a production bundle, and a gate that fires every week is one
      # people learn to ignore.
      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      # The resolved environment, not the declared ranges, so what is scanned
      # is what would actually be installed.
      - name: pip-audit
        run: uv run --with pip-audit pip-audit
        working-directory: apps/api
        continue-on-error: true

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run Playwright
        run: npm run test:e2e --workspace @aether/web
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
