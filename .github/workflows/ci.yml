name: CI

# Runs on every pull request and on main. Scope grows with the build: today it
# covers the frontend and the shared contract, which is what exists. Python
# lint/test, integration tests, the evaluation gate and container scanning are
# added by the phases that introduce them (docs/TDD.md section 20).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  frontend:
    name: Frontend (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # The lockfile is authoritative. The initial cold resolve needs
      # --legacy-peer-deps (an npm arborist bug in the vitest peer graph);
      # `npm ci` from the committed lockfile does not.
      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Unit tests
        run: npm run test --workspaces --if-present

      - name: Build
        run: npm run build --workspace @aether/web

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run Playwright
        run: npm run test:e2e --workspace @aether/web
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
