apiVersion: apps/v1
kind: Deployment
metadata:
  name: aether-api
  namespace: aether
  labels:
    app.kubernetes.io/name: aether
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aether
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aether
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '8000'
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      # Spread across nodes rather than packed onto one, so a node failure
      # costs a fraction of capacity instead of all of it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aether
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: aether-api:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: aether-config
            - secretRef:
                name: aether-secrets
          # Liveness asks /health, which touches no dependency: a restart
          # should mean "this process is broken", never "Postgres blinked".
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          # Readiness asks /ready, which does touch them - here the
          # consequence is that the pod leaves the Service's endpoints and
          # comes back, which is recoverable, unlike a restart loop.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          # The application imports about six seconds of Python before it
          # listens. Without a startup probe the liveness probe would kill it
          # mid-import, forever.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: aether-api
  namespace: aether
spec:
  selector:
    app.kubernetes.io/name: aether
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aether-api
  namespace: aether
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aether-api
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    # Out fast, in slow, for the same reason as the ECS policies: scaling in
    # during a lull and back out immediately costs a cold start every time.
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aether-api
  namespace: aether
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aether
      app.kubernetes.io/component: api
