# The settings every Aether process reads, and the shape of the ones that are
# not in this file.
#
# The split is the same one the task definitions make in Terraform: a value
# that would be a finding in a log lives in the Secret, everything else in the
# ConfigMap. There is no third category.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aether-config
  namespace: aether
data:
  APP_ENV: production
  LOG_LEVEL: info
  # The development identity is already refused outside local and test by
  # app/auth/principal.py. This is the second lock on the same door.
  DEV_IDENTITY_ENABLED: 'false'
  # One trusted hop: the ingress controller. See app/security/forwarded.py -
  # a larger number lets a caller choose their own rate-limit bucket.
  TRUSTED_PROXY_HOPS: '1'
  # Same-origin: the ingress routes /api to the API, so the browser's request
  # carries no cross-origin preflight and the session cookie is first-party.
  CORS_ALLOW_ORIGINS: ''
  STORAGE_BACKEND: s3
  S3_BUCKET: aether-artifacts
  S3_REGION: us-east-1
  METRICS_ENABLED: 'true'
  WORKER_CONCURRENCY: '1'
  WORKER_METRICS_PORT: '9100'
  # SEC blocks anonymous agents, and the application's default carries an
  # example.com contact. Put a real address here before applying.
  SEC_USER_AGENT: 'AetherResearch/0.1 (REPLACE_ME)'
  # Embeddings come from the Ollama Deployment in ollama.yaml, by its Service
  # name. Pinned rather than resolved: an index whose vectors came from two
  # models fails silently.
  EMBEDDING_MODEL: ollama:embed
  OLLAMA_BASE_URL: http://aether-ollama:11434
  # The origin people reach the ingress at. It is the access tokens' issuer and
  # audience, not only where single sign-on returns the browser, so it must be
  # set even with SSO off - the default is a developer's localhost.
  SSO_APP_BASE_URL: 'https://REPLACE_ME'
  SSO_REDIRECT_BASE_URL: 'https://REPLACE_ME/api/v1'
---
# Not a manifest to apply as it stands: the values are empty, and a Secret
# committed to a repository with values in it is the failure this file exists
# to avoid. Create it out of band, from a secret store or by hand:
#
#   kubectl -n aether create secret generic aether-secrets \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://...' \
#     --from-literal=REDIS_URL='rediss://...' \
#     --from-file=JWT_PRIVATE_KEY=jwt-signing-key.pem \
#     --from-literal=ANTHROPIC_API_KEY='...'
#
# A provider key left empty reads as absent rather than as an empty string
# (app/core/config.py), so that provider simply does not exist. JWT_PRIVATE_KEY
# is the exception: the API and the worker refuse to start without it. It is a
# P-256 private key in PEM form; the README's production setup says how to make
# one.
apiVersion: v1
kind: Secret
metadata:
  name: aether-secrets
  namespace: aether
  annotations:
    aether.dev/note: 'Shape only. Values are written outside version control.'
type: Opaque
stringData:
  DATABASE_URL: ''
  REDIS_URL: ''
  JWT_PRIVATE_KEY: ''
  ANTHROPIC_API_KEY: ''
  OPENAI_API_KEY: ''
  TAVILY_API_KEY: ''
  BRAVE_API_KEY: ''
  GITHUB_TOKEN: ''
  AUTH0_CLIENT_SECRET: ''
  SUPABASE_PUBLISHABLE_KEY: ''
