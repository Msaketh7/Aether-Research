# Scrape configuration for the local stack.
#
# The targets are compose service names, so they resolve only when the
# application profile is running (`make up-app`). Under a plain `make up` the
# API and the worker are expected on the host, outside this network, and
# Prometheus reports both jobs as down - which is the honest state rather than
# a misconfiguration.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: aether-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']

  - job_name: aether-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:9100']
