# Scrape configuration for the local stack.
# The api/worker targets start reporting in Phase 17 (observability); until then
# Prometheus simply reports them as down, which is the honest state.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: aether-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8000']

  - job_name: aether-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:9100']
